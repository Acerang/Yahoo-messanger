<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahoo! Messenger</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div id="app" v-cloak>
    <div class="bg-bubbles">
      <span v-for="i in 10" :key="i"></span>
    </div>
    <div class="login-wrapper">
      <div class="logo-area">
        <div class="yahoo-logo">
          <span class="y">Y!</span>
          <span class="messenger-text">Messenger</span>
        </div>
        <p class="tagline">Conectează-te cu prietenii tăi</p>
      </div>
      <div class="form-card">
        <div class="tabs">
          <button :class="['tab', { active: mode === 'login' }]"
            @click="mode = 'login'; clearError()">Autentificare</button>
          <button :class="['tab', { active: mode === 'register' }]" @click="mode = 'register'; clearError()">Cont
            nou</button>
        </div>
        <div class="error-msg" v-if="error"><span>⚠️ {{ error }}</span></div>
        <div class="success-msg" v-if="success"><span>✅ {{ success }}</span></div>
        <div v-if="mode === 'login'" class="form-section">
          <div class="field">
            <label>Yahoo! ID sau Email</label>
            <input type="text" v-model="loginForm.username" placeholder="id-ul tău yahoo" @keyup.enter="doLogin"
              :disabled="loading">
          </div>
          <div class="field">
            <label>Parolă</label>
            <div class="password-wrap">
              <input :type="showPassword ? 'text' : 'password'" v-model="loginForm.password" placeholder="••••••••"
                @keyup.enter="doLogin" :disabled="loading">
              <button class="toggle-pass" @click="showPassword = !showPassword">{{ showPassword ? '🙈' : '👁️'
                }}</button>
            </div>
          </div>
          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" v-model="loginForm.remember">
              <span>Ține-mă minte</span>
            </label>
          </div>
          <button class="btn-primary" @click="doLogin" :disabled="loading">
            <span v-if="!loading">🔑 Autentificare</span>
            <span v-else>⏳ Se conectează...</span>
          </button>
        </div>
        <div v-if="mode === 'register'" class="form-section">
          <div class="field">
            <label>Yahoo! ID (username)</label>
            <input type="text" v-model="registerForm.username" placeholder="alege un id unic" :disabled="loading">
          </div>
          <div class="field">
            <label>Nume afișat</label>
            <input type="text" v-model="registerForm.displayName" placeholder="cum vrei să apari" :disabled="loading">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" v-model="registerForm.email" placeholder="email@exemplu.com" :disabled="loading">
          </div>
          <div class="field">
            <label>Parolă</label>
            <div class="password-wrap">
              <input :type="showPassword ? 'text' : 'password'" v-model="registerForm.password"
                placeholder="minim 6 caractere" :disabled="loading">
              <button class="toggle-pass" @click="showPassword = !showPassword">{{ showPassword ? '🙈' : '👁️'
                }}</button>
            </div>
          </div>
          <button class="btn-primary" @click="doRegister" :disabled="loading">
            <span v-if="!loading">✨ Creează cont</span>
            <span v-else>⏳ Se procesează...</span>
          </button>
        </div>
        <div class="form-footer">
          <span v-if="mode === 'login'">Nu ai cont? <a @click="mode = 'register'">Înregistrează-te!</a></span>
          <span v-else>Ai deja cont? <a @click="mode = 'login'">Autentifică-te!</a></span>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          mode: 'login', loading: false, error: '', success: '', showPassword: false,
          loginForm: { username: '', password: '', remember: false },
          registerForm: { username: '', displayName: '', email: '', password: '' }
        };
      },
      methods: {
        clearError() { this.error = ''; this.success = ''; },
        async doLogin() {
          if (!this.loginForm.username || !this.loginForm.password) { this.error = 'Completează toate câmpurile'; return; }
          this.loading = true;
          if (this.loginForm.remember) { localStorage.setItem('yahoo_saved_username', this.loginForm.username); }
          else { localStorage.removeItem('yahoo_saved_username'); }
          try {
            const response = await $.ajax({
              url: '/api/auth/login', method: 'POST', contentType: 'application/json',
              data: JSON.stringify({ username: this.loginForm.username, password: this.loginForm.password, remember: this.loginForm.remember })
            });
            if (response.success) { window.location.href = '/chat'; }
          } catch (err) { this.error = err.responseJSON?.error || 'Eroare de conectare'; }
          finally { this.loading = false; }
        },
        async doRegister() {
          this.loading = true;
          try {
            const response = await $.ajax({
              url: '/api/auth/register', method: 'POST', contentType: 'application/json',
              data: JSON.stringify(this.registerForm)
            });
            if (response.success) { window.location.href = '/chat'; }
          } catch (err) { this.error = err.responseJSON?.error || 'Eroare la înregistrare'; }
          finally { this.loading = false; }
        }
      },
      mounted() {
        const savedUsername = localStorage.getItem('yahoo_saved_username');
        if (savedUsername) { this.loginForm.username = savedUsername; this.loginForm.remember = true; }
        $.get('/api/auth/me').done(() => { window.location.href = '/chat'; });
      }
    }).mount('#app');
  </script>
</body>

</html>
